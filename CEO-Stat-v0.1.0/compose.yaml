name: ceo-stat

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      assets:
        condition: service_completed_successfully
    networks: [ceo-stat]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [ceo-stat]

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ceo_stat
      MYSQL_USER: ceo_stat
      MYSQL_PASSWORD: ceo_stat_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "33060:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ceo-stat]

  assets:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build"
    volumes:
      - .:/app
      - node-modules:/app/node_modules

volumes:
  mysql-data:
  vendor:
  node-modules:

networks:
  ceo-stat:
